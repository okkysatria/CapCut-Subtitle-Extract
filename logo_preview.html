<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CapCut Subtitle Extract - Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Inter', 'Noto Sans', sans-serif;
    background: #121316;
    color: #e5e7eb;
    padding: 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #10b981; }
  .subtitle { color: #9ca3af; font-size: 14px; margin-bottom: 32px; }
  .logo-container {
    background: #1a1c23; border: 1px solid #2d3139; border-radius: 16px;
    padding: 48px; text-align: center;
  }
  .logo-container img { border-radius: 24px; box-shadow: 0 8px 32px rgba(16, 185, 129, 0.15); }
  .info { margin-top: 16px; font-size: 12px; color: #9ca3af; }
</style>
</head>
<body>
  <h1>CapCut Subtitle Extract</h1>
  <p class="subtitle">Logo — V2 Speech Bubble</p>
  <div class="logo-container">
    <img src="assets/logo.png" alt="Logo" width="384" height="384">
    <p class="info">assets/logo.png (512px) — juga tersedia: 256px, 128px, ICO</p>
  </div>
</body>
</html>
